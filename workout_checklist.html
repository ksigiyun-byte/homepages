<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데일리 운동 체크</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#f3f5fa;--card:#ffffff;--ink:#12161f;--sub:#6b7385;--line:#e4e8f1;--chip:#eef1f8;
  --swim:#0ea5e9;--run:#ff5a36;--push:#7c5cff;--hang:#10b981;--hero:#ff5a36;--heroInk:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1118;--card:#171b25;--ink:#f1f4fb;--sub:#97a0b5;--line:#262c3a;--chip:#212736;--swim:#38bdf8;--run:#ff7a59;--push:#9d85ff;--hang:#34d399;--hero:#ff6a45;--heroInk:#1a0c07;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0e1118;--card:#171b25;--ink:#f1f4fb;--sub:#97a0b5;--line:#262c3a;--chip:#212736;--swim:#38bdf8;--run:#ff7a59;--push:#9d85ff;--hang:#34d399;--hero:#ff6a45;--heroInk:#1a0c07;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{padding:18px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;font-weight:900;margin:0;letter-spacing:-.03em}
.streak{background:var(--hero);color:var(--heroInk);font-weight:800;font-size:13px;padding:7px 12px;border-radius:99px}
.month{display:flex;align-items:center;justify-content:space-between;margin-top:14px;background:var(--card);border-radius:18px;padding:6px}
.month b{font-size:18px;font-weight:800}
.month button{width:44px;height:44px;border:0;border-radius:14px;background:var(--chip);color:var(--ink);font-size:20px;font-weight:700}
.card{background:var(--card);border-radius:22px;padding:16px;margin-top:14px}
.dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:12px;color:var(--sub);font-weight:700;padding-bottom:6px}
.day{aspect-ratio:1/1.08;border:2px solid transparent;border-radius:14px;background:var(--chip);color:var(--ink);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.day.empty{background:none;visibility:hidden}
.day.today{border-color:var(--hero)}
.day.sel{background:var(--ink);color:var(--card)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.sec-title h2{font-size:17px;margin:0;font-weight:800}
.sec-title span{font-size:13px;color:var(--sub);font-weight:600}
.item{border-radius:18px;padding:14px;margin-bottom:10px;background:var(--chip);border:2px solid transparent}
.item:last-child{margin-bottom:0}
.item .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.item .name{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.tog{min-width:92px;height:48px;border-radius:14px;border:0;font-weight:800;font-size:15px;background:var(--card);color:var(--sub)}
.item.on{border-color:var(--c)}
.item.on .tog{background:var(--c);color:#fff}
.stepper{display:flex;align-items:center;gap:8px;margin-top:12px}
.stepper button{width:48px;height:48px;border-radius:14px;border:0;background:var(--card);color:var(--ink);font-size:22px;font-weight:700}
.stepper .val{flex:1;display:flex;align-items:center;justify-content:center;background:var(--card);border-radius:14px;height:48px;padding:0 8px;gap:4px}
.stepper input{width:100%;min-width:0;border:0;background:none;text-align:right;font-size:22px;font-weight:900;color:var(--ink);font-family:inherit;outline:none}
.stepper .u{font-weight:700;color:var(--sub);font-size:14px;min-width:20px}
.daynav{display:flex;align-items:center;justify-content:space-between;padding:8px}
.daynav button{width:52px;height:52px;border:0;border-radius:16px;background:var(--chip);color:var(--ink);font-size:22px;font-weight:700}
.daynav div{text-align:center}
.daynav b{display:block;font-size:19px;font-weight:900}
.daynav span{font-size:13px;color:var(--sub);font-weight:700}
.daynav .go{color:var(--hero);text-decoration:underline}
.chk{display:block;cursor:pointer}
.cb{-webkit-appearance:none;appearance:none;width:34px;height:34px;border-radius:11px;border:3px solid var(--sub);background:var(--card);margin:0;display:grid;place-content:center;flex:none}
.cb:checked{background:var(--c);border-color:var(--c)}
.cb:checked::after{content:"✓";color:#fff;font-weight:900;font-size:22px;line-height:1}
.chips button{flex:1;height:40px;border:0;border-radius:12px;background:var(--card);color:var(--c);font-weight:800;font-size:14px}
.item.on .stepper .val{box-shadow:inset 0 0 0 2px var(--c)}
.big{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1}
.big small{font-size:15px;font-weight:700;color:var(--sub);margin-left:4px}
.bar{height:12px;border-radius:99px;background:var(--chip);margin:12px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(14px,1fr));gap:3px}
.strip i{height:16px;border-radius:5px;background:var(--chip)}
.strip i.on{background:var(--c)}
.chart{display:flex;align-items:flex-end;gap:2px;height:140px;margin-top:14px;border-bottom:2px solid var(--line)}
.chart b{flex:1;display:block;border-radius:4px 4px 0 0;background:var(--c);min-height:2px}
.chart b.z{background:var(--chip)}
.chart b.cur{outline:2px solid var(--ink)}
.chart .col{flex:1;height:100%;display:flex;align-items:flex-end}
.chart .col b{width:100%}
.axis{display:flex;gap:2px;margin-top:4px}
.axis span{flex:1;text-align:center;font-size:9px;color:var(--sub);font-weight:600}
.cap{margin-top:8px;font-size:13px;color:var(--sub);font-weight:600;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--chip);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:17px;font-weight:900}
.stats span{font-size:11px;color:var(--sub);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;max-width:520px;margin:0 auto;z-index:5}
nav button{flex:1;height:52px;border:0;border-radius:16px;background:none;color:var(--sub);font-size:15px;font-weight:800;font-family:inherit}
nav button.act{background:var(--hero);color:var(--heroInk)}
button:focus-visible,input:focus-visible{outline:3px solid var(--push);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>데일리 운동 체크</h1><div class="streak" id="streak"></div></div>
    <div class="month"><button onclick="moveMonth(-1)" aria-label="이전 달">‹</button><b id="mlabel"></b><button onclick="moveMonth(1)" aria-label="다음 달">›</button></div>
  </header>
  <main id="app"></main>
</div>
<nav>
  <button id="t-log" onclick="setTab('log')">오늘 기록</button>
  <button id="t-stat" onclick="setTab('stat')">월간 그래프</button>
</nav>
<script>
const KEY='workout-checklist-v1';
let data={};
try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const now=new Date();
let vy=now.getFullYear(),vm=now.getMonth(),sel=key(vy,vm,now.getDate()),tab='log';
const todayKey=sel;
const blank=()=>({swim:false,run:0,push:0,hang:false});
const get=k=>Object.assign(blank(),data[k]||{});
function patch(k,p){
  const r=Object.assign(get(k),p);
  r.run=Math.max(0,Math.round(r.run*10)/10);
  r.push=Math.max(0,Math.round(r.push));
  if(!r.swim&&!r.hang&&!r.run&&!r.push)delete data[k];else data[k]=r;
  save();render();
}
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const done=r=>r.swim||r.hang||r.run>0||r.push>0;
const C={swim:'var(--swim)',run:'var(--run)',push:'var(--push)',hang:'var(--hang)'};

function moveMonth(n){
  vm+=n;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}
  const isCur=vy===now.getFullYear()&&vm===now.getMonth();
  sel=key(vy,vm,isCur?now.getDate():1);render();
}
function moveDay(n){const [y,m,d]=sel.split('-').map(Number);const t=new Date(y,m-1,d+n);vy=t.getFullYear();vm=t.getMonth();sel=key(vy,vm,t.getDate());render()}
function goToday(){vy=now.getFullYear();vm=now.getMonth();sel=todayKey;render()}
function setTab(t){tab=t;render();window.scrollTo(0,0)}
function pick(k){sel=k;render()}
function tog(f){patch(sel,{[f]:!get(sel)[f]})}
function add(f,n){patch(sel,{[f]:get(sel)[f]+n})}
function setv(f,v){const n=parseFloat(v);patch(sel,{[f]:isNaN(n)?0:n})}
function cap(id,t){document.getElementById(id).textContent=t}

function streak(){
  let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()),n=0;
  if(!data[key(d.getFullYear(),d.getMonth(),d.getDate())])d.setDate(d.getDate()-1);
  while(data[key(d.getFullYear(),d.getMonth(),d.getDate())]){n++;d.setDate(d.getDate()-1)}
  return n;
}

function calendar(){
  const first=new Date(vy,vm,1).getDay(),n=daysIn(vy,vm);
  let h='<div class="dow">'+['일','월','화','수','목','금','토'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="cal">';
  for(let i=0;i<first;i++)h+='<div class="day empty"></div>';
  for(let d=1;d<=n;d++){
    const k=key(vy,vm,d),r=get(k);
    const dots=['swim','run','push','hang'].filter(f=>f==='swim'||f==='hang'?r[f]:r[f]>0).map(f=>'<i style="background:'+C[f]+'"></i>').join('');
    h+='<button class="day'+(k===todayKey?' today':'')+(k===sel?' sel':'')+'" onclick="pick(\''+k+'\')">'+d+'<span class="dots">'+dots+'</span></button>';
  }
  return h+'</div>';
}

function logView(){
  const r=get(sel),[y,m,d]=sel.split('-').map(Number);
  const wd=['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()];
  return '<section class="card daynav"><button onclick="moveDay(-1)" aria-label="이전 날">‹</button><div><b>'+y+'년 '+m+'월 '+d+'일 ('+wd+')</b>'+(sel===todayKey?'<span>오늘</span>':'<span class="go" onclick="goToday()">오늘로 이동</span>')+'</div><button onclick="moveDay(1)" aria-label="다음 날">›</button></section>'+
  '<section class="card">'+
  '<label class="item chk'+(r.swim?' on':'')+'" style="--c:'+C.swim+'"><div class="row"><div class="name">🏊 수영</div><input type="checkbox" class="cb" '+(r.swim?'checked':'')+' onchange="tog(\'swim\')" aria-label="수영 했음"></div></label>'+
  '<div class="item'+(r.run>0?' on':'')+'" style="--c:'+C.run+'"><div class="name">🏃 달리기</div><div class="stepper"><button onclick="add(\'run\',-1)" aria-label="1km 빼기">−</button><div class="val"><input type="number" inputmode="decimal" step="0.1" min="0" value="'+(r.run||'')+'" placeholder="0" onchange="setv(\'run\',this.value)" aria-label="달리기 km"><span class="u">km</span></div><button onclick="add(\'run\',1)" aria-label="1km 더하기">+</button></div></div>'+
  '<div class="item'+(r.push>0?' on':'')+'" style="--c:'+C.push+'"><div class="name">💪 푸시업</div><div class="stepper"><button onclick="add(\'push\',-10)" aria-label="10개 빼기">−</button><div class="val"><input type="number" inputmode="numeric" step="1" min="0" value="'+(r.push||'')+'" placeholder="0" onchange="setv(\'push\',this.value)" aria-label="푸시업 개수"><span class="u">개</span></div><button onclick="add(\'push\',10)" aria-label="10개 더하기">+</button></div></div>'+
  '<label class="item chk'+(r.hang?' on':'')+'" style="--c:'+C.hang+'"><div class="row"><div class="name">🧗 매달리기</div><input type="checkbox" class="cb" '+(r.hang?'checked':'')+' onchange="tog(\'hang\')" aria-label="매달리기 했음"></div></label>'+
  '</section>';
}

function countCard(f,label,emoji,n,total,days){
  let strip='';for(let d=1;d<=total;d++)strip+='<i class="'+(days[d]?'on':'')+'"></i>';
  return '<section class="card" style="--c:'+C[f]+'"><div class="sec-title"><h2>'+emoji+' '+label+'</h2><span>이번 달 '+total+'일 중</span></div><div class="big">'+n+'<small>일</small></div><div class="bar"><i style="width:'+Math.round(n/total*100)+'%"></i></div><div class="strip">'+strip+'</div></section>';
}

function barCard(f,label,emoji,unit,vals,fmt){
  const n=vals.length-1,max=Math.max(...vals.slice(1),0);
  const act=vals.slice(1).filter(v=>v>0),sum=act.reduce((a,b)=>a+b,0);
  let bars='',ax='';
  for(let d=1;d<=n;d++){
    const v=vals[d],hh=max?Math.max(v/max*100,v>0?4:0):0;
    const isCur=key(vy,vm,d)===todayKey;
    bars+='<div class="col" onclick="cap(\'cap-'+f+'\',\''+(vm+1)+'/'+d+' · '+fmt(v)+unit+'\')"><b class="'+(v?'':'z')+(isCur?' cur':'')+'" style="height:'+(v?hh:2)+'%"></b></div>';
    ax+='<span>'+(d===1||d%5===0?d:'')+'</span>';
  }
  return '<section class="card" style="--c:'+C[f]+'"><div class="sec-title"><h2>'+emoji+' '+label+'</h2><span>막대를 눌러 확인</span></div><div class="big">'+fmt(sum)+'<small>'+unit+'</small></div><div class="chart">'+bars+'</div><div class="axis">'+ax+'</div><div class="cap" id="cap-'+f+'"></div>'+
  '<div class="stats"><div><b>'+act.length+'일</b><span>운동한 날</span></div><div><b>'+fmt(act.length?sum/act.length:0)+unit+'</b><span>하루 평균</span></div><div><b>'+fmt(max)+unit+'</b><span>최고 기록</span></div></div></section>';
}

function statView(){
  const n=daysIn(vy,vm),swim={},hang={},run=[0],push=[0];
  let sc=0,hc=0;
  for(let d=1;d<=n;d++){
    const r=get(key(vy,vm,d));
    if(r.swim){swim[d]=1;sc++}
    if(r.hang){hang[d]=1;hc++}
    run.push(r.run);push.push(r.push);
  }
  return countCard('swim','수영','🏊',sc,n,swim)+countCard('hang','매달리기','🧗',hc,n,hang)+
    barCard('run','달리기','🏃','km',run,v=>(Math.round(v*10)/10).toString())+
    barCard('push','푸시업','💪','개',push,v=>Math.round(v).toString());
}

function render(){
  document.getElementById('mlabel').textContent=vy+'년 '+(vm+1)+'월';
  document.querySelector('.month').style.display=tab==='log'?'none':'flex';
  const s=streak();
  document.getElementById('streak').textContent=s>0?'🔥 '+s+'일 연속':'오늘 시작해요';
  document.getElementById('t-log').className=tab==='log'?'act':'';
  document.getElementById('t-stat').className=tab==='stat'?'act':'';
  document.getElementById('app').innerHTML=tab==='log'?logView():statView();
}
render();
</script>
</body>
</html>
